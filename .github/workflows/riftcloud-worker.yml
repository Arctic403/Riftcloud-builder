name: RiftCloud Public Debug Builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riftcloud-worker.yml'
      - 'scripts/**'
      - 'README.md'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: RiftCloud branch, tag, or commit to build
        required: true
        default: main
        type: string
      client_id:
        description: Optional correlation id copied into build metadata
        required: false
        default: ''
        type: string
      publish:
        description: Publish the verified debug APK back to the RiftCloud source repo as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: riftcloud-public-debug-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ''
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}
      CLIENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.client_id || '' }}
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      SHOULD_BUILD: 'true'
      SOURCE_TOKEN: ${{ secrets.RIFTCLOUD_PRIVATE_TOKEN }}

    steps:
      - name: Check out public builder
        uses: actions/checkout@v7
        with:
          path: worker
          persist-credentials: false
          fetch-depth: 1

      - name: Check out RiftCloud source with private token
        if: ${{ env.SOURCE_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: Arctic403/Mobile-Cloudfare
          ref: ${{ env.SOURCE_REF }}
          token: ${{ env.SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out public RiftCloud source
        if: ${{ env.SOURCE_TOKEN == '' }}
        uses: actions/checkout@v7
        with:
          repository: Arctic403/Mobile-Cloudfare
          ref: ${{ env.SOURCE_REF }}
          path: source
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          CLIENT_ID="${CLIENT_ID:-manual-${GITHUB_RUN_ID}}"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "Building RiftCloud source ${SOURCE_SHA:0:12}"

      - name: Decide whether this source SHA needs a build
        env:
          GH_TOKEN: ${{ secrets.RIFTCLOUD_PRIVATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "SHOULD_BUILD=true" >> "$GITHUB_ENV"
            echo "Immediate/manual builder run: build will proceed."
            exit 0
          fi

          EXISTING="$(
            gh api -X GET "repos/Arctic403/Mobile-Cloudfare/releases?per_page=100" --paginate               --jq ".[] | select(.body != null and (.body | contains(\"$SOURCE_SHA\"))) | .tag_name"               | head -n 1
          )"

          if [ -n "$EXISTING" ]; then
            echo "SHOULD_BUILD=false" >> "$GITHUB_ENV"
            echo "RiftCloud source $SOURCE_SHA is already represented by release $EXISTING; scheduled build skipped."
          else
            echo "SHOULD_BUILD=true" >> "$GITHUB_ENV"
            echo "New RiftCloud source $SOURCE_SHA detected; scheduled build will proceed."
          fi

      - name: Set up Java 17
        if: ${{ env.SHOULD_BUILD == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        if: ${{ env.SHOULD_BUILD == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER" || { echo 'sdkmanager is unavailable.' >&2; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up pinned Gradle
        if: ${{ env.SHOULD_BUILD == 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build and verify RiftCloud debug APK
        if: ${{ env.SHOULD_BUILD == 'true' }}
        shell: bash
        run: bash worker/scripts/riftcloud-build.sh source

      - name: Publish debug prerelease back to RiftCloud
        if: ${{ success() && env.SHOULD_BUILD == 'true' && env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RIFTCLOUD_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:8}"
          TAG="riftcloud-debug-${GITHUB_RUN_ID}-${SHORT_SHA}"
          OUTPUT_DIR="$RUNNER_TEMP/riftcloud-output"

          cleanup_partial_release() {
            gh release delete "$TAG" --repo Arctic403/Mobile-Cloudfare --yes --cleanup-tag >/dev/null 2>&1 || true
          }
          trap cleanup_partial_release ERR

          gh release create "$TAG" "$OUTPUT_DIR"/*             --repo Arctic403/Mobile-Cloudfare             --target "$SOURCE_SHA"             --prerelease             --title "RiftCloud debug ${SHORT_SHA}"             --notes "Public RiftCloud debug build from source ${SOURCE_SHA}. Builder run ${GITHUB_RUN_ID}. Client ${CLIENT_ID}. This APK uses Android debug signing and is not a permanent update-signing lineage."

          trap - ERR

      - name: Preserve private failure diagnostics
        if: ${{ failure() && env.SOURCE_TOKEN != '' && env.SOURCE_SHA != '' }}
        env:
          GH_TOKEN: ${{ secrets.RIFTCLOUD_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/riftcloud-private-logs"
          test -d "$LOG_DIR" || exit 0
          SHORT_SHA="${SOURCE_SHA:0:8}"
          TAG="riftcloud-builder-failed-${GITHUB_RUN_ID}-${SHORT_SHA}"
          FAILURE_ZIP="$RUNNER_TEMP/RiftCloud-worker-failure-${SHORT_SHA}.zip"
          (cd "$LOG_DIR" && zip -qr "$FAILURE_ZIP" .)
          gh release create "$TAG" "$FAILURE_ZIP"             --repo Arctic403/Mobile-Cloudfare             --target "$SOURCE_SHA"             --prerelease             --title "RiftCloud builder FAILED ${SHORT_SHA}"             --notes "Public builder run ${GITHUB_RUN_ID} failed. Detailed diagnostics are attached privately."

      - name: Destroy source checkout and transient private logs
        if: ${{ always() }}
        run: |
          rm -rf source
          rm -rf "$RUNNER_TEMP/riftcloud-private-logs"
          rm -rf "$RUNNER_TEMP/riftcloud-output" "$RUNNER_TEMP/riftcloud-verification"
          echo 'RiftCloud source checkout and transient build data removed from the ephemeral runner.'
